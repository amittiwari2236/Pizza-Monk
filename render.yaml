services:
  - type: web
    name: pizza-monk
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_IDENTIFIERS
        value: admin,admin@canteen.com
      - key: ADMIN_PASSWORDS
        value: admin,admin123,Admin@123
