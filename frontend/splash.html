<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizza Monk's - Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, rgba(8, 6, 6, 0.75) 0%, rgba(14, 10, 10, 0.85) 50%, rgba(10, 6, 6, 0.96) 100%),
                  url('img/login_bg.jpg') no-repeat center center / cover;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
      position: relative;
      color: #FFFFFF;
    }

    /* Ambient Warm Glow Effect */
    .ambient-glow {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(225, 29, 72, 0.25) 0%, rgba(139, 30, 45, 0.08) 50%, transparent 70%);
      pointer-events: none;
      z-index: 1;
      filter: blur(40px);
    }

    .center-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 2;
      text-align: center;
      padding: 20px;
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Brand Seal Logo with Pulse Animation */
    .brand-logo-wrap {
      position: relative;
      margin-bottom: 18px;
    }

    .brand-logo-img {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: contain;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.75), 0 0 30px rgba(225, 29, 72, 0.3);
      border: 2.5px solid rgba(255, 255, 255, 0.2);
      animation: pulseGlow 3s infinite ease-in-out;
    }

    /* Handwritten Brush Script */
    .brush-headline {
      font-family: 'Caveat', cursive;
      font-size: 38px;
      line-height: 1.05;
      text-align: center;
      color: #FFFFFF;
      margin-top: 4px;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.8);
      user-select: none;
    }

    .brush-headline .red-script {
      color: #E11D48;
      display: block;
      font-size: 42px;
      font-weight: 700;
      text-shadow: 0 3px 18px rgba(225, 29, 72, 0.5);
    }

    .brand-canteen-pill {
      display: inline-block;
      background: rgba(225, 29, 72, 0.18);
      border: 1px solid rgba(225, 29, 72, 0.45);
      color: #FECDD3;
      padding: 5px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-top: 10px;
      text-transform: uppercase;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.2);
    }

    .tagline {
      margin-top: 12px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    /* Bottom Section matching Pizza Monk's theme */
    .bottom-section {
      width: 100%;
      height: 220px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 36px;
      z-index: 2;
    }

    /* Sleek Deep Crimson Waves replacing old green waves */
    .wave-bg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .powered-by {
      color: rgba(255, 255, 255, 0.85);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
    }

    /* 3 Dots Loading Animation in Crimson */
    .loading-dots {
      display: flex;
      gap: 7px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: #E11D48;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(225, 29, 72, 0.6);
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: scale(0.4);
        background-color: #E11D48;
        opacity: 0.5;
      }
      40% {
        transform: scale(1.1);
        background-color: #FFFFFF;
        opacity: 1;
      }
    }

    @keyframes pulseGlow {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.75), 0 0 25px rgba(225, 29, 72, 0.25);
      }
      50% {
        transform: scale(1.025);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.85), 0 0 35px rgba(225, 29, 72, 0.45);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="center-content">
    <div class="brand-logo-wrap">
      <img src="img/logo.png" alt="Pizza Monk's - My Canteen" class="brand-logo-img">
    </div>

    <div class="brush-headline">
      <span>Good Food</span>
      <span class="red-script">Brings People</span>
      <span>Together</span>
    </div>

    <div class="tagline">Fresh Dough • Premium Quality</div>
  </div>

  <div class="bottom-section">
    <!-- Smooth Deep Crimson and Charcoal Waves matching the Pizza Monk's Theme -->
    <svg class="wave-bg" preserveAspectRatio="none" viewBox="0 0 1440 320" xmlns="http://www.w3.org/2000/svg">
      <path fill="#8B1E2D" fill-opacity="0.5" d="M0,192L80,186.7C160,181,320,171,480,186.7C640,203,800,245,960,250.7C1120,256,1280,224,1360,208L1440,192L1440,320L1360,320C1280,320,1120,320,960,320C800,320,640,320,480,320C320,320,160,320,80,320L0,320Z"></path>
      <path fill="#4C0519" fill-opacity="0.85" d="M0,256L120,240C240,224,480,192,720,208C960,224,1200,288,1320,320L1440,352L1440,320L1320,320C1200,320,960,320,720,320C480,320,240,320,120,320L0,320Z"></path>
    </svg>

    <div class="powered-by">Powered by Pizza Monk's</div>
    <div class="loading-dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <script>
    // Mark splash as shown for this session
    sessionStorage.setItem('splashed', 'true');

    // Smooth redirect after intro
    setTimeout(() => {
      if (sessionStorage.getItem('userName')) {
        if (sessionStorage.getItem('userRole') === 'admin') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'index.html';
        }
      } else {
        window.location.href = 'login.html';
      }
    }, 1600);
  </script>
</body>
</html>
