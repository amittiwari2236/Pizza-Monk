<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Canteen - Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    if (!sessionStorage.getItem('userName')) {
      window.location.href = 'login.html';
    }
  </script>
</head>
<body>
  <div class="container">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <img src="img/logo.png" alt="Pizza Monk's" style="width: 44px; height: 44px; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.12); object-fit: cover;">
        <div>
          <h1 style="margin: 0; font-size: 24px; line-height: 1.1;">Menu</h1>
          <p style="color: var(--text-gray); margin: 2px 0 0 0; font-size: 12px; font-weight: 500;">Pizza Monk's • Fresh Dough & Quality</p>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; background: rgba(16, 185, 129, 0.12); color: #065F46; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;">
        <span style="width: 7px; height: 7px; background: #10B981; border-radius: 50%; display: inline-block;"></span>
        Live Menu
      </div>
    </div>

    <div class="search-bar">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" placeholder="Search for food...">
    </div>

    <div class="filter-pills" id="category-pills">
      <!-- Injected via JS -->
    </div>

    <div id="menu-list" class="mt-4">
      <!-- Injected via JS -->
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Home
    </a>
    <a href="menu.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M8.1 13.34l2.83-2.83L3.91 3.5c-1.56 1.56-1.56 4.09 0 5.66l4.19 4.18zm6.78-1.81c1.53.71 3.68.21 5.27-1.38 1.91-1.91 2.28-4.65.81-6.12-1.46-1.46-4.2-1.1-6.12.81-1.59 1.59-2.09 3.74-1.38 5.27L3.7 19.87l1.41 1.41L12 14.41l6.88 6.88 1.41-1.41L13.41 13l1.47-1.47z"/></svg>
      Menu
    </a>
    <a href="orders.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
      Orders
    </a>
    <a href="cart.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1.003 1.003 0 0020 4H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
      Cart
      <div class="nav-badge" id="cart-badge">0</div>
    </a>
  </nav>

  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/theme.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      let allItems = await getMenu();
      let categories = await getCategories();
      const container = document.getElementById('menu-list');
      const searchInput = document.querySelector('.search-bar input');
      const pillsContainer = document.getElementById('category-pills');
      
      const urlParams = new URLSearchParams(window.location.search);
      let initialCategory = urlParams.get('category') || 'All';
      
      let currentCategory = initialCategory;
      let searchQuery = '';

      // Render Dynamic Pills
      function renderCategoryPills() {
        pillsContainer.innerHTML = '<div class="pill">All</div>';
        if (Array.isArray(categories)) {
          categories.forEach(cat => {
            const pill = document.createElement('div');
            pill.className = 'pill';
            pill.innerText = cat.name;
            pillsContainer.appendChild(pill);
          });
        }

        const pills = pillsContainer.querySelectorAll('.pill');
        pills.forEach(pill => {
          if (pill.innerText === currentCategory) {
            pill.classList.add('active');
          }
          pill.addEventListener('click', () => {
            pills.forEach(p => p.classList.remove('active'));
            pill.classList.add('active');
            currentCategory = pill.innerText;
            renderMenu();
          });
        });
      }

      // Filter logic
      function renderMenu() {
        container.innerHTML = '';
        const menuArray = Array.isArray(allItems) ? allItems : [];
        const filtered = menuArray.filter(item => {
          const matchesCategory = currentCategory === 'All' || item.category === currentCategory;
          const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                (item.description && item.description.toLowerCase().includes(searchQuery.toLowerCase()));
          return matchesCategory && matchesSearch;
        });

        if (filtered.length === 0) {
          container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-gray);">No items found.</div>';
          return;
        }

        filtered.forEach(item => {
          const qty = getCartQuantity(item.id);
          const imgUrl = item.image_url ? (item.image_url.startsWith('http') ? item.image_url : `${item.image_url}`) : '/assets/food/cheese_corn_pizza.jpg';
          const card = document.createElement('div');
          card.className = `list-card ${!item.available ? 'out-of-stock' : ''}`;
          card.innerHTML = `
            <div class="img-container">
              <img src="${imgUrl}" alt="${item.name}" onerror="this.onerror=null;this.src='/assets/food/cheese_corn_pizza.jpg';">
            </div>
            <div class="info">
              <h3>${item.name}</h3>
              <p class="desc">${item.description || ''}</p>
              <div class="price-row">
                <div class="price">₹${item.price}</div>
                ${item.available ? `
                <div class="qty-control">
                  <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
                  <div class="qty-value" id="qty-${item.id}">${qty}</div>
                  <button class="qty-btn plus" onclick="updateQty(${item.id}, 1)">+</button>
                </div>` : `
                <div style="color:#DC2626; font-size: 14px; font-weight: bold;">Out of Stock</div>
                `}
              </div>
              ${item.available ? `
              <div class="available-badge mt-2">
                <div class="dot"></div> Available
              </div>
              ` : ''}
            </div>
          `;
          container.appendChild(card);
        });
      }

      // Search event
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderMenu();
      });

      // Initialize
      renderCategoryPills();
      renderMenu();
      updateCartBadge();

      // Listen for cart changes
      document.addEventListener('cartUpdated', () => {
        renderMenu();
        updateCartBadge();
      });

      // Real-time synchronization with Admin Panel
      try {
        const socket = io();
        socket.on('refresh_menu', async () => {
          console.log('⚡ Real-time menu update received from Admin');
          allItems = await getMenu();
          renderMenu();
        });

        socket.on('refresh_categories', async () => {
          console.log('⚡ Real-time categories update received from Admin');
          categories = await getCategories();
          renderCategoryPills();
          renderMenu();
        });

        window.addEventListener("pageshow", function(event) {
          if (event.persisted && socket.disconnected) {
            socket.connect();
          }
        });
      } catch (e) {
        console.warn('Socket connection error in menu:', e);
      }
    });
  </script>
</body>
</html>
